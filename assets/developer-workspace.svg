<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Developer workspace</title>
  <desc id="d">Decorative illustration: a code editor, a terminal, an API response panel, a Git branch diagram, a frontend–API–database architecture and a Plan, Code, Test, Build, Deploy pipeline. It is not a running terminal.</desc>
  <defs>
    <linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <radialGradient id="gl" cx=".7" cy=".2" r=".7"><stop offset="0" stop-color="#3B82F6" stop-opacity=".18"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="560" rx="20" fill="#0B0F19"/><rect width="1200" height="560" rx="20" fill="url(#gl)"/>
  <rect x="1" y="1" width="1198" height="558" rx="19" fill="none" stroke="#273449"/>

  <!-- editor -->
  <rect x="40" y="36" width="640" height="270" rx="12" fill="#111827" stroke="#273449"/>
  <path d="M40 48a12 12 0 0 1 12-12H668a12 12 0 0 1 12 12V72H40Z" fill="#182235"/>
  <circle cx="64" cy="54" r="6" fill="#F87171"/><circle cx="86" cy="54" r="6" fill="#FBBF24"/><circle cx="108" cy="54" r="6" fill="#34D399"/>
  <text x="140" y="59" font-family="Consolas,monospace" font-size="14" fill="#9CA3AF">server.js — Express · MongoDB</text>
  <g font-family="Consolas,'Courier New',monospace" font-size="16">
    <g fill="#4B5563" text-anchor="end"><text x="80" y="102">1</text><text x="80" y="128">2</text><text x="80" y="154">3</text><text x="80" y="180">4</text><text x="80" y="206">5</text><text x="80" y="232">6</text><text x="80" y="258">7</text><text x="80" y="284">8</text></g>
    <text x="100" y="102"><tspan fill="#8B5CF6">const</tspan><tspan fill="#F3F4F6"> app = </tspan><tspan fill="#3B82F6">express</tspan><tspan fill="#F3F4F6">();</tspan></text>
    <text x="100" y="128" fill="#6B7280">// a tiny API route</text>
    <text x="100" y="154"><tspan fill="#F3F4F6">app.</tspan><tspan fill="#3B82F6">get</tspan><tspan fill="#F3F4F6">(</tspan><tspan fill="#34D399">"/api/hello"</tspan><tspan fill="#F3F4F6">, (req, res) =&gt; {</tspan></text>
    <text x="124" y="180"><tspan fill="#F3F4F6">res.</tspan><tspan fill="#3B82F6">json</tspan><tspan fill="#F3F4F6">({ message: </tspan><tspan fill="#34D399">"Hello, world"</tspan><tspan fill="#F3F4F6"> });</tspan></text>
    <text x="100" y="206" fill="#F3F4F6">});</text>
    <text x="100" y="258"><tspan fill="#F3F4F6">app.</tspan><tspan fill="#3B82F6">listen</tspan><tspan fill="#F3F4F6">(</tspan><tspan fill="#22D3EE">3000</tspan><tspan fill="#F3F4F6">);</tspan></text>
  </g>
  <rect x="316" y="268" width="10" height="18" fill="#22D3EE"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>

  <!-- terminal -->
  <rect x="40" y="322" width="640" height="112" rx="12" fill="#0F172A" stroke="#273449"/>
  <text x="60" y="350" font-family="Consolas,monospace" font-size="14" fill="#9CA3AF">TERMINAL (illustration)</text>
  <g font-family="Consolas,monospace" font-size="15">
    <text x="60" y="378"><tspan fill="#22D3EE">$</tspan><tspan fill="#F3F4F6"> npm run dev</tspan></text>
    <text x="60" y="402" fill="#34D399">✔ server listening on port 3000</text>
    <text x="60" y="424"><tspan fill="#22D3EE">$</tspan></text>
  </g>

  <!-- API panel -->
  <rect x="710" y="36" width="450" height="130" rx="12" fill="#111827" stroke="#273449"/>
  <text x="730" y="64" font-family="Consolas,monospace" font-size="14" fill="#9CA3AF">API · request / response</text>
  <rect x="730" y="76" width="64" height="24" rx="6" fill="#3B82F6" fill-opacity=".2" stroke="#3B82F6"/><text x="762" y="93" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#3B82F6">GET</text>
  <text x="806" y="93" font-family="Consolas,monospace" font-size="14" fill="#F3F4F6">/api/hello</text>
  <text x="1130" y="93" text-anchor="end" font-family="Consolas,monospace" font-size="14" fill="#34D399">200 OK</text>
  <text x="730" y="128" font-family="Consolas,monospace" font-size="15" fill="#22D3EE">{ "message": "Hello, world" }</text>

  <!-- git graph -->
  <rect x="710" y="182" width="450" height="124" rx="12" fill="#111827" stroke="#273449"/>
  <text x="730" y="210" font-family="Consolas,monospace" font-size="14" fill="#9CA3AF">git · branches</text>
  <g fill="none" stroke-width="2.5"><path d="M740 250H1120" stroke="#3B82F6"/><path d="M820 250Q840 250 850 276H980Q990 276 1000 250" stroke="#8B5CF6"/></g>
  <g filter="url(#glow)"><circle cx="740" cy="250" r="6" fill="#3B82F6"/><circle cx="820" cy="250" r="6" fill="#3B82F6"/><circle cx="900" cy="276" r="6" fill="#8B5CF6"/><circle cx="960" cy="276" r="6" fill="#8B5CF6"/><circle cx="1010" cy="250" r="6" fill="#22D3EE"/><circle cx="1120" cy="250" r="6" fill="#22D3EE"/></g>
  <text x="740" y="232" font-family="Consolas,monospace" font-size="13" fill="#9CA3AF">main</text><text x="905" y="300" font-family="Consolas,monospace" font-size="13" fill="#9CA3AF">feature</text>

  <!-- architecture -->
  <rect x="710" y="322" width="450" height="112" rx="12" fill="#111827" stroke="#273449"/>
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#F3F4F6" text-anchor="middle">
    <rect x="730" y="356" width="110" height="46" rx="10" fill="#182235" stroke="#3B82F6"/><text x="785" y="384">Frontend</text>
    <rect x="895" y="356" width="110" height="46" rx="10" fill="#182235" stroke="#22D3EE"/><text x="950" y="384">API</text>
    <rect x="1040" y="356" width="100" height="46" rx="10" fill="#182235" stroke="#8B5CF6"/><text x="1090" y="384">Database</text>
  </g>
  <path d="M840 379H895M1005 379H1040" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4 6" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/></path>
  <text x="730" y="344" font-family="Consolas,monospace" font-size="14" fill="#9CA3AF">architecture</text>

  <!-- pipeline -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#F3F4F6" text-anchor="middle">
    <path d="M140 500H1060" stroke="url(#ac)" stroke-width="2" stroke-dasharray="6 8" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="5s" repeatCount="indefinite"/></path>
    <g filter="url(#glow)"><circle cx="140" cy="500" r="9" fill="#3B82F6"/><circle cx="380" cy="500" r="9" fill="#22D3EE"/><circle cx="620" cy="500" r="9" fill="#22D3EE"/><circle cx="860" cy="500" r="9" fill="#8B5CF6"/><circle cx="1060" cy="500" r="9" fill="#8B5CF6"/></g>
    <text x="140" y="535">Plan</text><text x="380" y="535">Code</text><text x="620" y="535">Test</text><text x="860" y="535">Build</text><text x="1060" y="535">Deploy</text>
  </g>
  <text x="600" y="466" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#9CA3AF">illustrative workflow · decorative, not a live environment</text>
</svg>
