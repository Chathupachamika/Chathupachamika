<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Chathupa Chamika — Developer</title>
  <desc id="d">Dark futuristic banner with a grid, connected glowing nodes and a terminal prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/><stop offset="0.55" stop-color="#0F172A"/><stop offset="1" stop-color="#182235"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3B82F6" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.2"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="url(#accent)" stroke-opacity="0.45"/>

  <!-- circuit lines -->
  <g fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 10">
    <path d="M700 60 H820 L860 100 H980 L1020 60 H1160">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M740 260 H880 L920 220 H1040 L1080 260 H1180">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M820 100 V180 L860 220">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="860" cy="100" r="5" fill="#22D3EE"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="60" r="5" fill="#3B82F6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="220" r="5" fill="#8B5CF6"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="260" r="5" fill="#22D3EE"><animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="100" r="4" fill="#3B82F6"/>
  </g>

  <!-- orbital -->
  <g transform="translate(1010 160)" fill="none">
    <circle r="62" stroke="#3B82F6" stroke-opacity="0.35" stroke-dasharray="3 7"/>
    <circle r="38" stroke="#8B5CF6" stroke-opacity="0.45"/>
    <circle r="6" fill="#22D3EE"/>
    <g><circle cx="62" cy="0" r="4" fill="#3B82F6"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/></g>
    <g><circle cx="-38" cy="0" r="3.5" fill="#8B5CF6"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/></g>
  </g>

  <!-- floating code symbols -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#3B82F6" fill-opacity="0.45">
    <text x="640" y="150">&lt;/&gt;
      <animate attributeName="y" values="150;140;150" dur="6s" repeatCount="indefinite"/></text>
    <text x="760" y="170" fill="#22D3EE">{ }
      <animate attributeName="y" values="170;180;170" dur="7s" repeatCount="indefinite"/></text>
    <text x="1130" y="130" fill="#8B5CF6">;
      <animate attributeName="y" values="130;120;130" dur="5s" repeatCount="indefinite"/></text>
  </g>

  <!-- text -->
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="60" y="90" font-size="18" fill="#9CA3AF">$ whoami</text>
    <text x="60" y="160" font-size="56" font-weight="700" fill="#F3F4F6" font-family="'Segoe UI', Arial, sans-serif">Chathupa Chamika</text>
    <text x="60" y="205" font-size="22" fill="url(#accent)" font-family="'Segoe UI', Arial, sans-serif">Full Stack Developer · MERN &amp; PHP</text>
    <text x="60" y="260" font-size="16" fill="#9CA3AF">&gt; Building ideas into software</text>
    <rect x="378" y="246" width="10" height="18" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
