<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Learning roadmap</title>
  <desc id="d">Three stages. Foundation: Java, JavaScript, Angular, Spring Boot, HTML, CSS. Building: full-stack development, web applications, project-based learning. Exploring: MERN stack, PHP and Laravel, cloud deployment with AWS.</desc>
  <defs><linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="340" rx="20" fill="#0B0F19"/><rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="#273449"/>
  <path d="M140 80H1060" stroke="url(#ac)" stroke-width="3" stroke-dasharray="8 8" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="6s" repeatCount="indefinite"/></path>
  <g filter="url(#glow)"><circle cx="200" cy="80" r="12" fill="#3B82F6"/><circle cx="600" cy="80" r="12" fill="#22D3EE"/><circle cx="1000" cy="80" r="12" fill="#8B5CF6"/></g>
  <g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle">
    <g><rect x="40" y="120" width="320" height="190" rx="14" fill="#111827" stroke="#3B82F6"/>
      <text x="200" y="155" font-size="22" font-weight="700" fill="#3B82F6">Foundation</text>
      <g font-size="16" fill="#F3F4F6"><text x="200" y="190">Java · JavaScript</text><text x="200" y="218">Angular · Spring Boot</text><text x="200" y="246">HTML · CSS</text></g>
      <text x="200" y="285" font-size="13" fill="#9CA3AF" font-family="Consolas,monospace">// what I already use</text></g>
    <g><rect x="440" y="120" width="320" height="190" rx="14" fill="#111827" stroke="#22D3EE"/>
      <text x="600" y="155" font-size="22" font-weight="700" fill="#22D3EE">Building</text>
      <g font-size="16" fill="#F3F4F6"><text x="600" y="190">Full-stack development</text><text x="600" y="218">Web applications</text><text x="600" y="246">Project-based learning</text></g>
      <text x="600" y="285" font-size="13" fill="#9CA3AF" font-family="Consolas,monospace">// learning by shipping</text></g>
    <g><rect x="840" y="120" width="320" height="190" rx="14" fill="#111827" stroke="#8B5CF6"/>
      <text x="1000" y="155" font-size="22" font-weight="700" fill="#8B5CF6">Exploring</text>
      <g font-size="16" fill="#F3F4F6"><text x="1000" y="190">MERN stack</text><text x="1000" y="218">PHP · Laravel</text><text x="1000" y="246">Cloud with AWS</text></g>
      <text x="1000" y="285" font-size="13" fill="#9CA3AF" font-family="Consolas,monospace">// what's next</text></g>
  </g>
  <text x="600" y="40" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#9CA3AF">learning direction · not a dated history</text>
</svg>
