<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Idea to deployment pipeline</title>
  <desc id="d">Six connected stages: Ideation, Design, Development, Testing, Deployment, Iteration, with an arrow returning from Iteration to Ideation.</desc>
  <defs><linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
  <rect width="1200" height="260" rx="20" fill="#0B0F19"/><rect x="1" y="1" width="1198" height="258" rx="19" fill="none" stroke="#273449"/>
  <path d="M110 120H1090" stroke="url(#ac)" stroke-width="2" stroke-dasharray="6 8" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="5s" repeatCount="indefinite"/></path>
  <path d="M1090 120V210H110V150" stroke="#273449" stroke-width="2" stroke-dasharray="4 8" fill="none"/>
  <text x="600" y="232" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#9CA3AF">iterate: feedback loops back into new ideas</text>
  <g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle">
    <g><rect x="50" y="78" width="120" height="84" rx="14" fill="#182235" stroke="#3B82F6"/><text x="110" y="112" font-size="24" fill="#3B82F6">01</text><text x="110" y="142" font-size="17" fill="#F3F4F6">Ideation</text></g>
    <g><rect x="246" y="78" width="120" height="84" rx="14" fill="#182235" stroke="#22D3EE"/><text x="306" y="112" font-size="24" fill="#22D3EE">02</text><text x="306" y="142" font-size="17" fill="#F3F4F6">Design</text></g>
    <g><rect x="442" y="78" width="120" height="84" rx="14" fill="#182235" stroke="#3B82F6"/><text x="502" y="112" font-size="24" fill="#3B82F6">03</text><text x="502" y="142" font-size="17" fill="#F3F4F6">Development</text></g>
    <g><rect x="638" y="78" width="120" height="84" rx="14" fill="#182235" stroke="#22D3EE"/><text x="698" y="112" font-size="24" fill="#22D3EE">04</text><text x="698" y="142" font-size="17" fill="#F3F4F6">Testing</text></g>
    <g><rect x="834" y="78" width="120" height="84" rx="14" fill="#182235" stroke="#8B5CF6"/><text x="894" y="112" font-size="24" fill="#8B5CF6">05</text><text x="894" y="142" font-size="17" fill="#F3F4F6">Deployment</text></g>
    <g><rect x="1030" y="78" width="120" height="84" rx="14" fill="#182235" stroke="#8B5CF6"/><text x="1090" y="112" font-size="24" fill="#8B5CF6">06</text><text x="1090" y="142" font-size="17" fill="#F3F4F6">Iteration</text></g>
  </g>
  <text x="600" y="50" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#9CA3AF">// how an idea becomes software (illustrative)</text>
</svg>
